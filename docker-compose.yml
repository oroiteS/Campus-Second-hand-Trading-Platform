# ============================================================
# Campus 二手交易平台 - 本地基础设施（开发环境）
#
#   启动：docker compose up -d
#   状态：docker compose ps
#   停止：docker compose down（数据保留在 .mongodb/ .mysql/ .chromadb/ .redis/）
#
#   所有端口仅绑定 127.0.0.1，数据库不暴露到局域网；
#   如需手机真机调试，把 ports 里的 "127.0.0.1:" 前缀去掉即可。
#
#   凭据统一从同目录 .env 读取（模板见 .env.example）
# ============================================================

name: campus

services:
  mongodb:
    image: mongo:8.0
    container_name: campus-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./.mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./.mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4
    container_name: campus-redis
    restart: unless-stopped
    environment:
      # 仅为 healthcheck / 运维 exec 提供，密码本体在 command 里生效
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: campus-chromadb
    restart: unless-stopped
    # Rust 版镜像经 /config.yaml 持久化到容器 /data（已实测确认），
    # 镜像内无 curl/wget/python，无法做容器内 healthcheck，
    # 健康检查请在宿主机执行：curl http://127.0.0.1:8000/api/v2/heartbeat
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - ./.chromadb:/data
