# 校园二手交易平台 REST API 契约
# ============================================================
# 本文件是前后端并行开发的唯一事实源（single source of truth）。
# - 覆盖节奏：批次 0 建立 components 公共规范与骨架接口；
#   之后每个开发批次开工前由契约任务增量追加该批次接口。
# - 修改规则：开发 agent 不得直接修改本文件；契约修订走
#   feat/api/b<批次>-<主题> 分支 + 审查，并登记 docs/api/CHANGELOG.md。
# - 版本号：与 CHANGELOG.md 条目一一对应。

openapi: 3.0.3

info:
  title: 校园二手交易平台 API
  version: 0.3.0
  description: |
    ## 总则

    本契约服务于前后端并行开发：前端以本文件生成 TypeScript 类型（`openapi-typescript`）
    并构建契约同构的 mock；后端实现与文档化以此为准。基线文档：

    - 需求分析 v1.0（已确认）：`docs/需求分析.md`
    - 项目规范 v0.5：`docs/plan/00-项目规范.md`（契约硬规则、批次与变更流程）

    ### 统一响应体

    所有接口（含错误）HTTP 层返回语义化状态码，响应 body 一律为：

    ```json
    { "code": 0, "message": "ok", "data": { } }
    ```

    | 字段 | 类型 | 说明 |
    | --- | --- | --- |
    | `code` | integer | `0` 表示成功；非 `0` 为业务错误码（见下表） |
    | `message` | string | 面向用户的提示文案（中文）；成功时固定 `ok` |
    | `data` | object / array / null | 业务数据；错误时为 `null` 或补充信息对象 |

    ### 业务错误码（分段制）

    `code = 0` 成功；失败按模块分段。**已定义 10xx / 20xx / 30xx / 90xx
    四段**（20xx 用户域段为批次 1 · v0.2.0 新增；30xx 商品域段为
    批次 2 · v0.3.0 新增），40xx–60xx 段已预留，具体码随所属批次契约
    更新补全：

    | code | HTTP | 含义 | 说明 |
    | --- | --- | --- | --- |
    | 0 | 2xx | 成功 | |
    | 1001 | 401 | 令牌缺失或无效 | 未携带 `Authorization` 或令牌解析失败 |
    | 1002 | 401 | 令牌已过期 | 前端应清除本地令牌并引导重新登录 |
    | 1003 | 401 | 令牌已注销 | `logout` 后 `jti` 已入黑名单 |
    | 1004 | 403 | 未通过校园认证 | 商品域等需认证接口的准入失败，平台最硬准入线 |
    | 1005 | 403 | 需要管理员权限 | 管理接口角色校验失败 |
    | 1006 | 429 | 登录失败次数超限 | 连续 5 次失败限流 10 分钟 |
    | 2001 | 409 | 用户名已存在 | 注册 |
    | 2002 | 409 | 学号已被注册 | 注册 |
    | 2003 | 400 | 原密码错误 | 修改密码 |
    | 2004 | 422 | 重置凭证不匹配 | 用户名与学号/邮箱对不上；用户名不存在同样返回（防探测） |
    | 2005 | 401 | 用户名或密码错误 | 登录失败；连续 5 次后转 `429 / 1006` |
    | 2006 | 403 | 账号已被封禁 | `status = banned` 用户登录 |
    | 3001 | 409 | 商品状态不允许该操作 | 编辑 / 删除 / 上下架 / 收藏的前置状态不满足（如编辑 `trading` 商品、删除 `sold` 商品、收藏非 `on_sale` 商品）；`message` 说明当前状态与允许的操作 |
    | 3002 | 403 | 商品已被管理员强制下架 | 卖家对 `forced_off` 商品请求重新上架（仅管理员可恢复，批次 5 场景前置） |
    | 40xx | — | 交易域 | 批次 3 定义（订单/支付/评价） |
    | 50xx | — | 聊天域 | 批次 4 定义（会话/消息） |
    | 60xx | — | 管理域 | 批次 5 定义（审核/处置/统计/导入） |
    | 9001 | 422 | 参数校验失败 | `data` 可携带字段级错误列表 |
    | 9002 | 404 | 资源不存在或无权访问 | 含"非本校资源"场景；**不区分两种情况，防跨校探测** |
    | 9003 | 409 | 资源状态冲突 | 如商品已被锁定下单、订单状态不允许该操作 |
    | 9004 | 503 | 依赖服务不可用 | 仅用于降级后无法完成本操作的场景 |
    | 9005 | 500 | 服务器内部错误 | |
    | 9006 | 429 | 请求过于频繁 | 1006 之外的通用限流 |
    | 9007 | 405 | 方法不支持 | 请求方法与路由不匹配（405 场景统一走 envelope 返回） |

    ### 鉴权

    - 方式：`Authorization: Bearer <JWT>`（`flask-jwt-extended` 签发）。
    - 除标注 **公开** 的接口外均需登录；商品域接口额外要求已通过校园认证
      （未认证返回 `403 / 1004`）；`/api/admin/*` 额外要求 `role = admin`
      （返回 `403 / 1005`）。
    - 图片实体文件经后端鉴权路由访问，不暴露可枚举静态目录；学生证照片仅
      本人与管理员可读（越权返回 `404 / 9002`，同样防探测）。
    - 图片 Cookie 通道：登录成功时 `Set-Cookie img_token`（httpOnly、
      SameSite=Lax、Path=/api/images、TTL 同令牌，值为同一 JWT）；
      `GET /api/images/{id}` 优先 `Authorization` 头，缺失时回退该
      Cookie，二者走同一 JWT 校验与黑名单；登出时清除。**仅图片路由
      接受 Cookie 认证，其余接口一律 Bearer**。

    ### 同校隔离

    - 认证学生的一切商品域查询仅返回本校数据；构造他校资源 id 一律
      `404 / 9002`，不泄露存在性。
    - 管理员跨校可见，但只读与处置，不具备交易能力。

    ### 降级约定

    依赖（Embedding / Chroma / Redis / MongoDB）故障时**业务仍可用的接口照常
    返回 200**，并在 `data` 中附加可选字段 `degraded: true` 与
    `degraded_reason: string`，便于前端展示降级提示与答辩演示。

    ### 通用格式约定

    | 项 | 约定 |
    | --- | --- |
    | 时间 | ISO 8601 字符串，含时区偏移（统一 `+08:00`），如 `2026-10-20T15:04:05+08:00` |
    | 金额 | number，单位元，最多两位小数 |
    | id | integer（int64） |
    | 分页参数 | `page`（从 1 起）、`page_size`（默认 20，上限 100） |
    | 上传 | `multipart/form-data`；单文件 ≤ 5 MB；仅 `jpg` / `png` / `webp`；服务端五件套校验：扩展名 + MIME + 大小 + 内容魔数嗅探（PNG 8 字节签名 / JPEG SOI / WEBP RIFF+WEBP）+ 内容哈希改名 |
    | 布尔状态值 | 一律英文小写枚举（如 `on_sale`、`pending`），中文仅出现在展示文案 |

    ### 工具链

    - Swagger UI：`GET /api/docs`（flask-swagger-ui，离线可用）。
    - 规范原文：`GET /api/openapi.json`（本文件的 JSON 序列化）。
    - 前端类型生成：`openapi-typescript docs/api/openapi.yaml -o src/api/types.ts`
      （脚本化进 `campus_frontend/package.json`，组件只准引用生成类型）。
    - WebSocket 契约不在本文件内，见 `docs/api/websocket-事件.md`。

    ### 标签规划（后续批次按此追加，保持稳定）

    `system`(批次0) ·
    `auth`/`users`/`certification`/`schools`/`images`(批次1 已建立用户域部分) ·
    `products`/`categories`/`favorites`/`recommendations`(批次2 已建立商品域
    部分；`images` 的商品图用途批次 2 扩展) · `uploads`(批次2 新增通用
    tag，b4 聊天图复用) · `orders`(批次3) · `conversations`(批次4) ·
    `admin`(批次5)

# ============================================================

servers:
  - url: http://127.0.0.1:5000/api
    description: |
      主仓开发环境（main）。前端 Vite dev server 将 `/api` 与 `/socket.io`
      代理至此地址。worktree 隔离端口（5010/5020/5030）见 00-项目规范
      「数据与端口隔离」；联调时以后端实际监听端口替换。

tags:
  - name: system
    description: 系统与健康检查（批次 0 建立）
  - name: auth
    description: 注册 / 登录 / 登出 / 密码重置（批次 1 建立）
  - name: users
    description: 个人资料 / 密码修改 / 头像上传（批次 1 建立）
  - name: certification
    description: 校园认证申请提交与历史查询（批次 1 建立）
  - name: schools
    description: 学校与校区公开列表（批次 1 建立）
  - name: images
    description: 图片实体鉴权访问（批次 1 建立用户域用途；商品图用途批次 2 扩展）
  - name: products
    description: 商品发布 / 详情 / 列表 / 搜索与我的商品（批次 2 建立）
  - name: categories
    description: 商品分类列表（批次 2 建立）
  - name: favorites
    description: 商品收藏与收藏列表（批次 2 建立）
  - name: recommendations
    description: 首页个性化推荐（批次 2 建立）
  - name: uploads
    description: 通用图片上传（批次 2 建立商品图用途；b4 聊天图复用扩展）

# 全局默认鉴权：标注「公开」的接口在路径内以 security: [] 覆盖
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 健康检查
      description: |
        **公开**。探测 MySQL / MongoDB / Redis / Chroma 四库连通性与
        Embedding 端点生效模式（云端 / 本地），供启动自检、批次 0 联调
        冒烟与答辩演示（AC-18）。

        - 任一依赖不可用时 HTTP 仍返回 200，由 `data.status = degraded`
          表达，逐项明细见 `data.services` 与 `data.embedding`。
        - Embedding 双模（云端优先、本地兜底）的生效模式写入
          `data.embedding.mode`。
      security: []
      responses:
        '200':
          description: 健康信息（含部分依赖不可用的降级态）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
              example:
                code: 0
                message: ok
                data:
                  status: ok
                  checked_at: '2026-10-20T11:30:00+08:00'
                  services:
                    mysql:
                      status: up
                      latency_ms: 3
                      error: null
                    mongodb:
                      status: up
                      latency_ms: 5
                      error: null
                    redis:
                      status: up
                      latency_ms: 1
                      error: null
                    chroma:
                      status: up
                      latency_ms: 8
                      error: null
                  embedding:
                    mode: cloud
                    model: qwen3.7-text-embedding-flash
                    dim: 1024
                    status: up

  /openapi.json:
    get:
      tags: [system]
      operationId: getOpenapiSpec
      summary: OpenAPI 规范原文（JSON）
      description: |
        **公开**。返回本文件（`docs/api/openapi.yaml`）的 JSON 序列化，
        供 Swagger UI 与工具链消费。由后端 `src/common/` 提供并保持与
        仓库内 yaml 同步。
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 文档对象。
          content:
            application/json:
              schema:
                type: object

  /docs:
    get:
      tags: [system]
      operationId: getSwaggerUi
      summary: Swagger UI 页面
      description: |
        **公开**。flask-swagger-ui 蓝图渲染的接口文档页面（静态资源随包
        分发，离线可用）。批次 0 联调冒烟项之一。
      security: []
      responses:
        '200':
          description: Swagger UI HTML 页面。
          content:
            text/html:
              schema:
                type: string

  # ============================================================
  # 用户域（批次 1 · v0.2.0）：auth / users / certification / schools / images
  # ============================================================

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册
      description: |
        **公开**。用户名 + 密码 + 邮箱 + 学号注册；昵称可选，缺省取
        `username`。注册成功**不签发令牌**，需再调用 `POST /auth/login`；
        `username` 与 `student_no` 注册后不可修改。

        - 字段校验（双端同源唯一口径，pattern 见 `RegisterInput`）失败
          统一 `422 / 9001`，`data.fields` 携带字段级错误。
        - 唯一性冲突：用户名已存在 `409 / 2001`；学号已被注册 `409 / 2002`。
        - 密码落库为 bcrypt 加盐哈希（NFR-05），任何链路不得明文、不得
          可逆加密、不得以无盐快速哈希替代。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            example:
              username: zhangsan01
              password: Pass1234
              email: zhangsan01@example.edu.cn
              student_no: '2024010101'
              nickname: 小张
      responses:
        '200':
          description: 注册成功，返回新建用户资料（不签发令牌）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
              example:
                code: 0
                message: ok
                data:
                  id: 1
                  username: zhangsan01
                  student_no: '2024010101'
                  email: zhangsan01@example.edu.cn
                  nickname: 小张
                  display_name: 小张
                  phone: null
                  avatar: null
                  school: null
                  campus: null
                  role: student
                  auth_status: unverified
                  status: active
                  credit_score: null
                  created_at: '2026-10-20T15:04:05+08:00'
        '409':
          description: 用户名已存在（code 2001）或学号已被注册（code 2002）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                username_taken:
                  summary: 用户名已存在
                  value:
                    code: 2001
                    message: 用户名已存在
                    data: null
                student_no_taken:
                  summary: 学号已被注册
                  value:
                    code: 2002
                    message: 学号已被注册
                    data: null
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录
      description: |
        **公开**。用户名或学号 + 密码登录，签发 JWT（flask-jwt-extended，
        identity = 用户 id）。`account` 先按 `username` 精确匹配，未命中
        按 `student_no` 匹配。

        - 用户名或密码错误 `401 / 2005`；账号已被封禁 `403 / 2006`——
          封禁用户即使密码正确也返回 `2006`，且按一次失败计入限流。
        - 连续失败 5 次后 10 分钟内返回 `429 / 1006`（限流键
          `rate:login:{ip}`，登录成功清零计数）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              account: zhangsan01
              password: Pass1234
      responses:
        '200':
          description: 登录成功，返回访问令牌与用户资料；同时 Set-Cookie 签发图片 Cookie 通道令牌 img_token。
          headers:
            Set-Cookie:
              description: |
                图片 Cookie 通道令牌：`img_token=<JWT>`（httpOnly、
                SameSite=Lax、Path=/api/images、TTL 同访问令牌，值为同一
                JWT），供 `GET /api/images/{id}` 缺失 `Authorization` 头时
                回退使用；`POST /auth/logout` 对应清除。
              schema:
                type: string
              example: img_token=eyJhbGciOiJIUzI1NiJ9.sig; HttpOnly; SameSite=Lax; Path=/api/images; Max-Age=86400
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginData'
              example:
                code: 0
                message: ok
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZGVudGl0eSI6IjEiLCJqdGkiOiJiMWFwaS1kZW1vIn0.sig
                  token_type: Bearer
                  expires_in: 86400
                  user:
                    id: 1
                    username: zhangsan01
                    student_no: '2024010101'
                    email: zhangsan01@example.edu.cn
                    nickname: 小张
                    display_name: 小张
                    phone: null
                    avatar: null
                    school: null
                    campus: null
                    role: student
                    auth_status: unverified
                    status: active
                    credit_score: null
                    created_at: '2026-10-20T15:04:05+08:00'
        '401':
          description: 用户名或密码错误（code 2005；不区分用户名不存在与密码错误，防探测）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: 2005
                message: 用户名或密码错误
                data: null
        '403':
          description: 账号已被封禁（code 2006；即使密码正确亦拒绝，并按一次失败计入限流）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: 2006
                message: 账号已被封禁
                data: null
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出
      description: |
        需登录（不要求校园认证状态）。无请求体；将当前令牌 `jti` 写入
        Redis 黑名单 `auth:blacklist:{jti}`，TTL 为令牌剩余有效期。

        - 正常：`data` 为空对象 `{}`。
        - Redis 故障降级：仍返回 200，`data` 为
          `{ degraded: true, degraded_reason: <原因摘要> }`——黑名单未落，
          令牌仍有效至自然过期，服务端日志告警（降级显式可见）。
      responses:
        '200':
          description: |
            登出成功。正常 `data = {}`；Redis 故障降级时 `data` 为
            `{ degraded: true, degraded_reason: string }`（令牌有效至自然过期）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: 正常为空对象；Redis 故障降级时含 degraded 标记与 degraded_reason。
              example:
                code: 0
                message: ok
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: 重置密码
      description: |
        **公开**。用户名 + 学号或邮箱 + 新密码重置（不发邮件、不发短信）。
        成功后不清除已签发令牌（无会话管理需求，YAGNI）。

        - 凭证不匹配（用户名与所选渠道的学号/邮箱对不上）返回
          `422 / 2004`；**用户名不存在同样返回 `2004`**，不泄露用户名
          存在性（防探测）。
        - 字段校验失败 `422 / 9001`（新密码强度等，`data.fields` 字段级）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInput'
            example:
              username: zhangsan01
              reset_channel: student_no
              reset_value: '2024010101'
              new_password: NewPass1234
      responses:
        '200':
          description: 重置成功（data 为 null；已签发令牌不清除）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
                        description: 固定为 null。
              example:
                code: 0
                message: ok
