  /products/search:
    get:
      tags: [products]
      operationId: searchProducts
      summary: 商品向量搜索
      description: |
        需登录且已通过校园认证（verified）。`q` 拼指令前缀向量化 →
        Chroma 余弦召回 top 60（where：本校 + `on_sale`）→ MySQL 按 id
        与业务条件精筛 → **按原始相似度降序**分页；`n_results` 取召回
        上限 1.5 倍（90）供过滤损耗。

        - `q` 必填 1–100 字符，空白视为未填写 → `422 / 9001`。
        - 降级：Embedding 或 Chroma 不可用 → MySQL `LIKE` 标题匹配
          （按 `created_at` 倒序），`data` 附加 `degraded: true` 与
          `degraded_reason`；LIKE 恒可用，故本接口实际不触达 `9004`
          （正常降级一律 200 + `degraded`）。
        - **不写缓存**（条件组合爆炸）。
      parameters:
        - name: q
          in: query
          required: true
          description: 搜索词（1–100 字符）；空白视为未填写 → 9001。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: category_id
          in: query
          required: false
          description: 分类 id 筛选；填写时须为启用分类，否则 9001。
          schema:
            type: integer
            format: int64
        - name: condition
          in: query
          required: false
          description: 成色筛选（ProductCondition 单值）。
          schema:
            $ref: '#/components/schemas/ProductCondition'
        - name: price_min
          in: query
          required: false
          description: 价格下界（元，≥ 0）；须 ≤ price_max。
          schema:
            type: number
            minimum: 0
        - name: price_max
          in: query
          required: false
          description: 价格上界（元，≥ 0）。
          schema:
            type: number
            minimum: 0
        - name: campus_id
          in: query
          required: false
          description: 校区 id 筛选；填写时须为本校启用校区，否则 9001。
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: |
            搜索结果分页（按原始相似度降序；降级时按 created_at 倒序并
            附加 degraded 字段）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedData'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ProductSummary'
                              degraded:
                                type: boolean
                                description: 降级标记；正常响应不带（false 语义）。
                              degraded_reason:
                                type: string
                                description: 降级原因摘要；正常响应不带。
              examples:
                normal:
                  summary: 正常（向量召回，按原始相似度降序）
                  value:
                    code: 0
                    message: ok
                    data:
                      items:
                        - id: 101
                          title: 罗技 K845 机械键盘
                          price: 199.0
                          original_price: 399.0
                          condition: excellent
                          status: on_sale
                          cover:
                            id: 42
                            url: /api/images/42
                          favorite_count: 3
                          category:
                            id: 1
                            name: 数码电子
                          seller:
                            id: 2
