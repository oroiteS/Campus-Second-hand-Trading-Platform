                        $ref: '#/components/schemas/FavoriteActionData'
              example:
                code: 0
                message: ok
                data:
                  favorited: true
                  favorite_count: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 重复收藏（code 9003）或商品状态不允许收藏（code 3001）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                duplicate:
                  summary: 重复收藏
                  value:
                    code: 9003
                    message: 已收藏该商品
                    data: null
                invalid_status:
                  summary: 商品非在售
                  value:
                    code: 3001
                    message: 商品当前状态为已下架，仅上架商品可收藏
                    data: null

    delete:
      tags: [favorites]
      operationId: unfavoriteProduct
      summary: 取消收藏（幂等）
      description: |
        需登录且已通过校园认证（verified，学生）。无请求体；幂等：未收藏
        同样返回 200。按 (user, product) 直查本校记录，无记录 → 200；
        商品非本校 / 不存在仍 `404 / 9002`（防探测）。收藏时已校验同校，
        不存在跨校收藏记录边界。
      parameters:
        - name: id
          in: path
          required: true
          description: 商品 id。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 取消成功（幂等，未收藏同样 200），返回最新收藏状态与收藏数。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FavoriteActionData'
              example:
                code: 0
                message: ok
                data:
                  favorited: false
                  favorite_count: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /favorites/mine:
    get:
      tags: [favorites]
      operationId: listMyFavorites
      summary: 我的收藏列表
      description: |
        需登录且已通过校园认证（verified，学生）。当前用户收藏的商品分页
        列表，按收藏时间（`favorited_at`）倒序；条目为商品概要 + 收藏
        时间，**含 `off_sale` / `sold` / `trading` 商品**（前端按
        status 置灰并提供取消入口）；`deleted` 商品条目不返回。
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 我的收藏分页列表（favorited_at 倒序）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedData'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  allOf:
                                    - $ref: '#/components/schemas/ProductSummary'
                                    - type: object
                                      required: [favorited_at]
                                      properties:
                                        favorited_at:
                                          type: string
                                          format: date-time
                                          description: 收藏时间（ISO 8601，+08:00）。
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 101
                      title: 罗技 K845 机械键盘
                      price: 199.0
                      original_price: 399.0
                      condition: excellent
                      status: off_sale
                      cover:
                        id: 42
                        url: /api/images/42
                      favorite_count: 3
                      category:
                        id: 1
                        name: 数码电子
                      seller:
                        id: 2
                        display_name: 小明-示例大学(东校区)
                        nickname: 小明
                        auth_status: approved
                        role: student
                      campus:
                        id: 1
                        school_id: 1
                        name: 东校区
                      created_at: '2026-10-21T10:00:00+08:00'
                      favorited_at: '2026-10-21T12:00:00+08:00'
                  page: 1
                  page_size: 20
                  total: 1
                  pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: 商品分类列表
      description: |
        需登录且已通过校园认证（verified；2026-10-21 用户确认，与商品域
        准入线一致）。全部启用（`enabled`）分类，按 `sort_order` 升序、
        id 升序；**不分页**——全局分类量小，发布 / 筛选选择器一次取全。
        缓存 `product:category:all` TTL 3600s（管理员维护后失效——
        批次 5 接手）。
      responses:
        '200':
          description: 启用分类列表（sort_order 升序、id 升序，不分页）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryRef'
              example:
                code: 0
                message: ok
                data:
                  - id: 1
                    name: 数码电子
                  - id: 2
                    name: 图书教材
                  - id: 3
                    name: 生活用品
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /uploads:
    post:
      tags: [uploads]
      operationId: uploadImage
      summary: 通用图片上传
      description: |
        需登录且已通过校园认证（verified，学生；管理员上传一律
        `409 / 9003`，message 说明管理员无交易能力）。`multipart/form-data`：
        `file` 单文件 + `purpose` form 字段（本批次仅 `product`）。

        - 五件套校验（见总则「通用格式约定」）：扩展名 + MIME + 大小
          （≤ 5 MB）+ 内容魔数嗅探（PNG 8 字节签名 / JPEG SOI / WEBP
          RIFF+WEBP）+ 内容哈希改名；不符 `422 / 9001`，
          `data.fields.file` 携带原因。
        - 实体落 `uploads/product/<年月>/`，文件名改写为内容哈希；
          `owner_id` 记录；**发布前图片无商品关联**（孤儿，见清理策略）。
        - b4 聊天图复用本接口扩展 `purpose=image_message`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件（jpg/png/webp，≤ 5 MB，五件套校验）。
                purpose:
                  type: string
                  enum: [product]
                  description: 上传用途；本批次仅 product（商品图），b4 扩展 image_message（聊天图）。
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: 上传成功，返回图片引用（发布前无商品关联）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ImageRef'
              example:
                code: 0
                message: ok
                data:
                  id: 42
                  url: /api/images/42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 管理员上传拒绝（code 9003；管理员无交易能力）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: 9003
                message: 管理员无交易能力，不能上传商品图片
                data: null
        '422':
          description: 文件类型 / 大小 / 魔数不符（code 9001；data.fields.file 携带原因）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: 9001
                message: 参数校验失败
                data:
                  fields:
                    file: 仅支持 jpg / png / webp 且不超过 5 MB，文件内容与扩展名不符

  /recommendations/home:
    get:
      tags: [recommendations]
      operationId: getHomeRecommendations
      summary: 首页推荐
      description: |
        需登录且已通过校园认证（verified，学生；管理员 → 空列表 200，无
        推荐语义）。返回 ≤ 40 个本校 `on_sale` 商品（排除自己发布、批内
        按 id 去重）。

        - 配比：有画像 32 画像召回 + 8 随机补足（召回不足以随机补齐
          缺口）；冷启动（无 `user_profiles` 文档）全随机 40。
        - 缓存 `product:home:{school}:{user}` TTL 300s；`refresh`
          传 `"true"` 时绕过缓存强制重算（「换一批」）。
        - 降级：Embedding / Chroma / Mongo 任一不可用 → 全随机 +
          `degraded: true`；Redis 不可用 → 不缓存直算，**不算 degraded**。
      parameters:
        - name: refresh
          in: query
          required: false
          description: 传 "true" 时绕过缓存强制重算（「换一批」）。
          schema:
            type: string
      responses:
        '200':
          description: 首页推荐列表（≤ 40 个；管理员返回空列表）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 40
                            items:
                              $ref: '#/components/schemas/ProductSummary'
                          degraded:
                            type: boolean
                            description: 降级标记；正常响应不带（false 语义）。
                          degraded_reason:
                            type: string
                            description: 降级原因摘要；正常响应不带。
              examples:
                normal:
                  summary: 正常（画像召回 32 + 随机补足 8）
                  value:
                    code: 0
                    message: ok
                    data:
                      items:
                        - id: 105
                          title: 小米真无线蓝牙耳机 Air2
                          price: 89.0
                          original_price: 199.0
                          condition: as_new
                          status: on_sale
                          cover:
                            id: 50
                            url: /api/images/50
                          favorite_count: 1
                          category:
                            id: 1
                            name: 数码电子
                          seller:
                            id: 2
                            display_name: 小明-示例大学(东校区)
                            nickname: 小明
                            auth_status: approved
                            role: student
                          campus:
                            id: 1
                            school_id: 1
                            name: 东校区
                          created_at: '2026-10-20T18:30:00+08:00'
                degraded:
                  summary: 降级（Embedding/Chroma/Mongo 不可用，全随机推荐）
                  value:
                    code: 0
                    message: ok
                    data:
                      items:
                        - id: 105
                          title: 小米真无线蓝牙耳机 Air2
                          price: 89.0
                          original_price: 199.0
                          condition: as_new
                          status: on_sale
                          cover:
                            id: 50
                            url: /api/images/50
                          favorite_count: 1
                          category:
                            id: 1
                            name: 数码电子
                          seller:
                            id: 2
                            display_name: 小明-示例大学(东校区)
                            nickname: 小明
                            auth_status: approved
                            role: student
                          campus:
                            id: 1
                            school_id: 1
                            name: 东校区
                          created_at: '2026-10-20T18:30:00+08:00'
                      degraded: true
                      degraded_reason: 向量服务不可用，已降级为随机推荐
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ============================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`Authorization: Bearer <token>`，由 `POST /api/auth/login` 签发。'

  # ---------- 可复用请求参数 ----------
  parameters:
    PageParam:
      name: page
      in: query
      description: 页码，从 1 起。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      description: 每页条数，默认 20，上限 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ---------- 可复用错误响应 ----------
  responses:
    Unauthorized:
      description: 未登录或令牌无效（code 1001 / 1002 / 1003）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 1002
            message: 登录已过期，请重新登录
            data: null
    Forbidden:
      description: 未通过校园认证或无管理员权限（code 1004 / 1005）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 1004
            message: 请先完成校园认证
            data: null
    NotFound:
      description: 资源不存在或无权访问（code 9002；含非本校资源，防探测）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 9002
            message: 资源不存在
            data: null
    ValidationError:
      description: 参数校验失败（code 9001；data 携带字段级错误）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 9001
            message: 参数校验失败
            data:
              fields:
                password: 密码长度不得低于 8 位且需包含字母与数字
    Conflict:
      description: 资源状态冲突（code 9003；如商品已被锁定、订单状态不允许该操作）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 9003
            message: 当前状态不允许该操作
            data: null
    RateLimited:
      description: 请求过于频繁（code 1006 登录限流 / 9006 通用限流）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 1006
            message: 登录失败次数过多，请 10 分钟后重试
            data: null
    InternalError:
      description: 服务器内部错误（code 9005）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 9005
            message: 服务开小差了，请稍后重试
            data: null

  # ---------- Schema ----------
  schemas:
    # -- 响应外层 --
    SuccessEnvelope:
      type: object
      description: |
        成功响应外层。`data` 的实际类型由各接口经 `allOf` 覆盖定义；
        降级场景在 `data` 内附加 `degraded: true` 与 `degraded_reason`。
      required: [code, message, data]
      properties:
        code:
          type: integer
          enum: [0]
          description: 0 表示成功。
        message:
          type: string
          example: ok
        data: {}

    ErrorEnvelope:
      type: object
      description: 错误响应外层。code 取值见「业务错误码」表。
      required: [code, message]
      properties:
        code:
          type: integer
          description: 非 0 业务错误码。
        message:
          type: string
          description: 面向用户的中文提示。
        data:
          type: object
          nullable: true
          description: 补充信息（如 9001 的字段级错误），无则为 null。

    PaginatedData:
      type: object
      description: |
        分页数据容器。`items` 元素类型由各列表接口经 `allOf` 覆盖；
        与 `PageParam` / `PageSizeParam` 查询参数配套。
      required: [items, page, page_size, total, pages]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0

    # -- 健康检查 --
    ServiceHealth:
      type: object
      description: 单个存储依赖的连通状态。
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency_ms:
          type: integer
          nullable: true
          description: 探测往返耗时（毫秒）；不可用时为 null。
        error:
          type: string
          nullable: true
          description: 不可用时的原因摘要；正常为 null。

    EmbeddingHealth:
      type: object
      description: |
        Embedding 端点状态。云端优先、本地兜底：`mode` 报告当前生效
        模式；两者皆不可用时 `status = down` 且 `mode = null`。
      required: [mode, model, dim, status]
      properties:
        mode:
          type: string
          nullable: true
          enum: [cloud, local]
          description: cloud = 云端 OpenAI 兼容端点；local = 进程内本地模型；两者皆不可用时为 null。
        model:
          type: string
          example: qwen3.7-text-embedding-flash
        dim:
          type: integer
          description: 向量维度，须与 Chroma 集合一致。
          example: 1024
        status:
          type: string
          enum: [up, down]

    HealthData:
      type: object
      description: 健康检查数据体。
      required: [status, checked_at, services, embedding]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: 全部依赖可用为 ok，任一不可用为 degraded。
        checked_at:
          type: string
          format: date-time
          description: 探测时间（ISO 8601，+08:00）。
        services:
          type: object
          required: [mysql, mongodb, redis, chroma]
          properties:
            mysql:
              $ref: '#/components/schemas/ServiceHealth'
            mongodb:
              $ref: '#/components/schemas/ServiceHealth'
            redis:
              $ref: '#/components/schemas/ServiceHealth'
            chroma:
              $ref: '#/components/schemas/ServiceHealth'
        embedding:
          $ref: '#/components/schemas/EmbeddingHealth'

    # -- 公共引用类型（概要） --
    ImageRef:
      type: object
      description: |
        图片引用。实体文件经后端鉴权路由 `GET /api/images/{id}` 访问，
        不暴露可枚举静态目录；`url` 为同源相对路径，`<img>` 标签经图片
        Cookie 通道直接可渲染。
      required: [id, url]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: 鉴权访问路径（同源相对路径）。
          example: /api/images/42

    CategoryRef:
      type: object
      description: 分类引用（全局单级分类）。
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 数码电子

    SchoolRef:
      type: object
      description: 学校引用（公开列表与管理场景共用的概要形态）。
      required: [id, name, multi_campus]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 示例大学
        multi_campus:
          type: boolean
          description: 是否多校区；多校区时认证申请必须选择校区。

    CampusRef:
      type: object
      description: 校区引用。
      required: [id, school_id, name]
      properties:
        id:
          type: integer
          format: int64
        school_id:
          type: integer
          format: int64
        name:
          type: string
          example: 东校区

    UserSummary:
      type: object
      description: |
        用户概要：列表与引用场景（卖家、评价人、会话对象）共用的形态。
        字段级定稿随批次 1 用户接口落地，微调经 CHANGELOG 登记。
      required: [id, display_name, nickname, auth_status, role]
      properties:
        id:
          type: integer
          format: int64
        display_name:
          type: string
          description: |
            展示名。认证通过后固定为「昵称-学校名称」，多校区学校为
            「昵称-学校名称(校区名称)」（FR-USR-10）；未认证为昵称。
          example: 小明-示例大学(东校区)
        nickname:
          type: string
        avatar:
          allOf:
            - $ref: '#/components/schemas/ImageRef'
          nullable: true
        credit_score:
          type: number
          nullable: true
          description: |
            信誉分：该用户收到的全部评价评分的算术平均，两位小数；
            无评价为 null（批次 3 起有评价后非空），前端展示「暂无」
            （FR-ORD-09）。
          example: 4.67
        auth_status:
          $ref: '#/components/schemas/AuthStatus'
        role:
          $ref: '#/components/schemas/Role'

    ProductSummary:
      type: object
      description: |
        商品卡片概要：首页推荐宫格、列表、搜索结果共用。
        详情字段（描述、图集、浏览量等）随批次 2 商品详情接口定义。
      required: [id, title, price, condition, status, favorite_count, created_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: 罗技 K845 机械键盘 98 新
        price:
          type: number
          description: 售价（元，两位小数）。
          example: 199.0
        original_price:
          type: number
          nullable: true
          description: 原价（元），可空。
          example: 399.0
        condition:
          $ref: '#/components/schemas/ProductCondition'
        status:
          $ref: '#/components/schemas/ProductStatus'
        cover:
          allOf:
            - $ref: '#/components/schemas/ImageRef'
          nullable: true
          description: 封面图（图集首图）；无图商品为 null。
        favorite_count:
          type: integer
          description: 收藏数。
          minimum: 0
        category:
          allOf:
            - $ref: '#/components/schemas/CategoryRef'
          nullable: true
        seller:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
        campus:
          allOf:
            - $ref: '#/components/schemas/CampusRef'
          nullable: true
        created_at:
          type: string
          format: date-time
          description: 发布时间（ISO 8601，+08:00）。

    # -- 商品域数据（批次 2 · v0.3.0） --
    ProductCondition:
      type: string
      enum: [brand_new, as_new, excellent, good, fair]
      description: |
        成色：brand_new 全新（未拆封/未使用）/ as_new 99 新（几乎无使用痕迹）/
        excellent 九成新（轻微使用痕迹）/ good 八成新（少量磨损，功能完好）/
        fair 七成新及以下（明显使用痕迹）。中文仅出现在展示文案。

    ProductDetail:
      description: |
        商品详情完整形态（继承 ProductSummary 全字段）：详情页、发布与
        编辑成功响应共用。
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [description, images, view_count, is_favorited, updated_at]
          properties:
            description:
              type: string
              description: 商品描述（1–2000 字符）。
            images:
              type: array
              minItems: 1
              maxItems: 9
              items:
                $ref: '#/components/schemas/ImageRef'
              description: 图集，数组顺序即展示排序。
            view_count:
              type: integer
              minimum: 0
              description: 浏览量。
            is_favorited:
              type: boolean
              description: 当前用户是否已收藏（管理员恒 false）。
            updated_at:
              type: string
              format: date-time
              description: 最近更新时间（ISO 8601，+08:00）。

    FavoriteActionData:
      type: object
      description: 收藏 / 取消收藏操作结果数据体。
      required: [favorited, favorite_count]
      properties:
        favorited:
          type: boolean
          description: 操作后收藏状态（收藏 true / 取消 false）。
        favorite_count:
          type: integer
          minimum: 0
          description: 该商品最新收藏数。

    # -- 商品域请求体（批次 2 · 字段校验双端同源：后端独立复验，前端表单预检；失败统一 422 / 9001） --
    ProductCreateInput:
      type: object
      description: |
        商品发布 / 编辑共用请求体（编辑为全量替换；`image_ids` 数组顺序
        即展示排序）。
      required: [title, description, price, category_id, condition, image_ids]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
          description: 标题（1–50 字符）。
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: 描述（1–2000 字符）。
        price:
          type: number
          minimum: 0.01
          maximum: 99999.99
          multipleOf: 0.01
          description: 售价（元，0.01–99999.99，最多两位小数；后端 Decimal 校验，禁 float 直比）。
        original_price:
          type: number
          nullable: true
          minimum: 0.01
          maximum: 99999.99
          multipleOf: 0.01
          description: 原价（元），可空；填写时约束同 price。
        category_id:
          type: integer
          format: int64
          description: 分类 id；须为存在且 enabled 的分类（服务端查库复验）。
        condition:
          $ref: '#/components/schemas/ProductCondition'
        campus_id:
          type: integer
          format: int64
          nullable: true
          description: 校区 id；缺省取发布者校区；填写须为本人学校启用校区。
        image_ids:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            type: integer
            format: int64
          description: 已上传图片 id；须为本人 purpose=product 上传；数组序=排序。

    ProductStatusActionInput:
      type: object
      description: 商品上下架请求体（目标状态仅 on_sale / off_sale 二值）。
      required: [status]
      properties:
        status:
          type: string
          enum: [on_sale, off_sale]
          description: 目标状态：on_sale 上架 / off_sale 下架。

    # -- 用户域数据（批次 1） --
    UserProfile:
      type: object
      description: 个人资料完整形态（与 UserSummary 概要形态并存）。
      required: [id, username, student_no, email, nickname, display_name, role, auth_status, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          description: 用户名（注册后不可修改）。
        student_no:
          type: string
          description: 学号（注册后不可修改）。
        email:
          type: string
          format: email
        nickname:
          type: string
        display_name:
          type: string
          description: 展示名，规则同 UserSummary（FR-USR-10）。
          example: 小张-示例大学(东校区)
        phone:
          type: string
          nullable: true
          pattern: '^1\d{10}$'
          description: 手机号：1 开头的 11 位纯数字；未设置为 null。
        avatar:
          allOf:
            - $ref: '#/components/schemas/ImageRef'
          nullable: true
        school:
          allOf:
            - $ref: '#/components/schemas/SchoolRef'
          nullable: true
          description: 认证通过后展示；未认证为 null。
        campus:
          allOf:
            - $ref: '#/components/schemas/CampusRef'
          nullable: true
          description: 多校区学校认证通过后展示；未认证 / 单校区为 null。
        role:
          $ref: '#/components/schemas/Role'
        auth_status:
          $ref: '#/components/schemas/AuthStatus'
        status:
          $ref: '#/components/schemas/UserAccountStatus'
        credit_score:
          type: number
          nullable: true
          description: 信誉分；批次 3 起有评价后非空。
        created_at:
          type: string
          format: date-time
          description: 注册时间（ISO 8601，+08:00）。

    LoginData:
      type: object
      description: 登录成功数据体。
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: JWT（flask-jwt-extended 签发，identity = 用户 id）。
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: 令牌有效期（秒，JWT_EXPIRE_MINUTES × 60）。
        user:
          $ref: '#/components/schemas/UserProfile'

    AuthApplication:
      type: object
      description: 校园认证申请（新提交只会出现 pending；历史含 rejected）。
      required: [id, school, student_no, real_name, student_card, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        school:
          $ref: '#/components/schemas/SchoolRef'
        campus:
          allOf:
            - $ref: '#/components/schemas/CampusRef'
          nullable: true
        student_no:
          type: string
        real_name:
          type: string
        student_card:
          $ref: '#/components/schemas/ImageRef'
        status:
          $ref: '#/components/schemas/AuthStatus'
        reject_reason:
          type: string
          nullable: true
          description: 驳回原因（管理员填写）；非 rejected 为 null。
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          description: 审核时间；未审核为 null。
        created_at:
          type: string
          format: date-time
          description: 提交时间（ISO 8601，+08:00）。

    SchoolWithCampuses:
      type: object
      description: 学校概要 + 校区列表（公开列表元素）。
      allOf:
        - $ref: '#/components/schemas/SchoolRef'
        - type: object
          required: [campuses]
          properties:
            campuses:
              type: array
              items:
                $ref: '#/components/schemas/CampusRef'

    # -- 用户域请求体（批次 1 · 字段校验双端同源：后端独立复验，前端表单预检；失败统一 422 / 9001） --
    RegisterInput:
      type: object
      description: 注册请求体（注册成功不签发令牌）。
      required: [username, password, email, student_no]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,31}$'
          minLength: 1
          maxLength: 32
          description: 用户名（1–32 位，字母开头，仅字母/数字/下划线），注册后不可修改。
        password:
          type: string
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{8,64}$'
          description: 密码（8–64 位，须同时包含字母与数字）；落库为 bcrypt 加盐哈希（NFR-05）。
        email:
          type: string
          format: email
          description: 邮箱。
        student_no:
          type: string
          minLength: 1
          maxLength: 32
          description: 学号（1–32 字符，不限定纯数字），注册后不可修改。
        nickname:
          type: string
          minLength: 1
          maxLength: 32
          description: 昵称（1–32 字符），可选，缺省取 username。

    LoginInput:
      type: object
      description: 登录请求体（account 先按用户名精确匹配，未命中按学号匹配）。
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 32
          description: 用户名或学号（1–32 字符）。
        password:
          type: string
          description: 密码明文（仅与 bcrypt 哈希比对，登录时不校验强度）。

    PasswordResetInput:
      type: object
      description: 密码重置请求体（不发邮件短信；凭证不匹配与用户名不存在一律 2004，防探测）。
      required: [username, reset_channel, reset_value, new_password]
      properties:
        username:
          type: string
          description: 用户名。
        reset_channel:
          type: string
          enum: [student_no, email]
          description: 重置凭证渠道：student_no 学号 / email 邮箱。
        reset_value:
          type: string
          description: 凭证值；渠道为 student_no 时须与注册学号一致，为 email 时须与注册邮箱一致。
        new_password:
          type: string
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{8,64}$'
          description: 新密码（8–64 位，须同时包含字母与数字）。

    ProfileUpdateInput:
      type: object
      description: |
        个人资料更新请求体：三字段均可选，仅更新请求体中出现的字段；
        username / student_no 不可改，不在请求体中。
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 32
          description: 昵称（1–32 字符）。
        email:
          type: string
          format: email
          description: 邮箱。
        phone:
          type: string
          nullable: true
          pattern: '^1\d{10}$'
          description: |
            手机号：填写时为 1 开头的 11 位纯数字；**传空串表示清除**
            （服务端对空串放行），未设置为 null。

    PasswordChangeInput:
      type: object
      description: 修改密码请求体（须校验原密码，原密码错误返回 400 / 2003）。
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          description: 原密码。
        new_password:
          type: string
          pattern: '^(?=.*[A-Za-z])(?=.*\d).{8,64}$'
          description: 新密码（8–64 位，须同时包含字母与数字）。

    # -- 业务枚举（值域由需求分析状态机定死，双端不得私改） --
    Role:
      type: string
      enum: [student, admin]
      description: 角色：student 学生 / admin 管理员（管理员不能发布商品或下单）。

    AuthStatus:
      type: string
      enum: [unverified, pending, approved, rejected]
      description: |
        校园认证状态：unverified 未认证 / pending 待审核 /
        approved 已通过 / rejected 已驳回（驳回展示管理员填写的原因）。

    UserAccountStatus:
      type: string
      enum: [active, banned]
      description: 账号状态：active 正常 / banned 封禁（封禁用户禁止登录）。

    ProductStatus:
      type: string
      enum: [on_sale, trading, sold, off_sale, deleted]
      description: |
        商品状态：on_sale 上架 / trading 交易中（仅买卖双方与管理员可见）/
        sold 已售 / off_sale 已下架（管理员强制下架仅管理员可恢复）/
        deleted 已删除。仅 on_sale 参与列表、搜索与推荐。

    ModerationStatus:
      type: string
      enum: [normal, pending_review, handled]
      description: |
        敏感词复核状态：normal 正常 / pending_review 待复核（命中词库，
        照常可见并进入管理队列）/ handled 已处置。

    OrderStatus:
      type: string
      enum: [pending_payment, paid, completed, cancelled, closed]
      description: |
        订单状态：pending_payment 待支付（30 分钟未支付自动关闭）/
        paid 已支付 / completed 已完成 / cancelled 已取消 /
        closed 已关闭（支付超时）。

    PaymentStatus:
      type: string
      enum: [pending, paid, refunded]
      description: 支付记录状态：pending 待支付 / paid 已支付 / refunded 已退款（已支付订单协商取消）。

    ChatContentType:
      type: string
      enum: [text, image]
      description: 聊天消息类型：text 文本 / image 图片（复用统一上传能力）。
