  /images/{id}:
    get:
      tags: [images]
      operationId: getImage
      summary: 图片实体鉴权访问
      description: |
        需登录。鉴权：`Authorization: Bearer` 或图片 Cookie（见总则
        「图片 Cookie 通道」）双通道，二者走同一 JWT 校验与黑名单。
        返回图片实体二进制（`image/jpeg|png|webp`）。**本接口不走统一
        响应体 envelope**，直接输出文件流；出错时仍按 `ErrorEnvelope`
        的 JSON 结构返回错误体。

        - 访问控制（NFR-08）：`purpose = student_card` 的图片**仅上传者
          本人与管理员**可读；其余（`avatar` 与本版本扩展的 `product`）
          登录即可读。
        - 越权与不存在一律 `404 / 9002`，不区分两种情况（防探测）。
        - `purpose` 值域本版本扩展 `product`（商品图）；批次 4 聊天图
          复用本接口，值域随批次继续扩展。
      parameters:
        - name: id
          in: path
          required: true
          description: 图片 id。
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 图片实体二进制（不走统一响应体 envelope）。
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # 商品域（批次 2 · v0.3.0）：products / categories / favorites /
  # uploads / recommendations
  # ============================================================

  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: 本校在售商品分页列表
      description: |
        需登录且已通过校园认证（verified）。本校 `status = on_sale` 商品
        分页列表；管理员对本校跨校区可见全部商品（`g.scope_all`），但
        发布 / 编辑 / 收藏 / 上传等写操作对管理员一律拒绝（见各写接口）。

        - 筛选：`category_id`（须为启用分类）/ `condition` / `price_min` /
          `price_max`（数值 ≥ 0 且 `price_min ≤ price_max`，违反 → 9001）/
          `campus_id`（须为本校启用校区）/ `keyword`（LIKE 标题匹配，
          全角不转义直配，≤ 100 字符）；`sort` 缺省 `newest`。
        - 筛选参数无效（分类 / 校区不存在或停用、价格区间颠倒等）返回
          `422 / 9001`，`data.fields` 字段级错误。
        - 列表缓存 `product:list:{school}:{hash}` TTL 120s 为**可选优化**
          （NFR-04 达标不强制；若实现，编辑 / 状态变更 / 删除须同步失效）。
      parameters:
        - name: category_id
          in: query
          required: false
          description: 分类 id 筛选；填写时须为启用分类，否则 9001。
          schema:
            type: integer
            format: int64
        - name: condition
          in: query
          required: false
          description: 成色筛选（ProductCondition 单值）。
          schema:
            $ref: '#/components/schemas/ProductCondition'
        - name: price_min
          in: query
          required: false
          description: 价格下界（元，≥ 0）；须 ≤ price_max。
          schema:
            type: number
            minimum: 0
        - name: price_max
          in: query
          required: false
          description: 价格上界（元，≥ 0）。
          schema:
            type: number
            minimum: 0
        - name: campus_id
          in: query
          required: false
          description: 校区 id 筛选；填写时须为本校启用校区，否则 9001。
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          description: 标题关键词（LIKE 匹配，全角不转义直配，≤ 100 字符）。
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          description: 排序方式，缺省 newest。
          schema:
            type: string
            enum: [newest, price_asc, price_desc]
            default: newest
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 本校在售商品分页列表（仅 on_sale）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginatedData'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ProductSummary'
              example:
                code: 0
                message: ok
                data:
                  items:
                    - id: 101
                      title: 罗技 K845 机械键盘
                      price: 199.0
                      original_price: 399.0
                      condition: excellent
                      status: on_sale
                      cover:
                        id: 42
                        url: /api/images/42
                      favorite_count: 3
                      category:
                        id: 1
                        name: 数码电子
                      seller:
                        id: 2
                        display_name: 小明-示例大学(东校区)
                        nickname: 小明
                        auth_status: approved
                        role: student
                      campus:
                        id: 1
                        school_id: 1
                        name: 东校区
                      created_at: '2026-10-21T10:00:00+08:00'
                  page: 1
                  page_size: 20
                  total: 1
                  pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 筛选参数无效（code 9001；data.fields 字段级错误）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: 9001
                message: 参数校验失败
                data:
                  fields:
                    price_min: 价格下界不得大于价格上界

    post:
      tags: [products]
      operationId: createProduct
      summary: 发布商品
      description: |
        需登录且已通过校园认证（verified，学生；管理员发布一律
        `409 / 9003`，message 说明管理员无交易能力——与 b1 认证提交对
        管理员的处理口径一致）。

        - 字段校验（双端同源，约束见 `ProductCreateInput`）失败统一
          `422 / 9001`（`data.fields` 字段级）：含 `image_ids` 归属
          （须本人 `purpose=product` 上传）与数量（1–9）、`category_id`
          无效、`campus_id` 非本校启用校区。
        - 发布成功商品 `status = on_sale`、`moderation_status = normal`
          （敏感词库批次 5 接入）；**发布成功不依赖向量写入结果**（向量
          异步写入，失败进重试队列）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
            example:
              title: 罗技 K845 机械键盘
              description: 去年购入，自用一年，键帽轻微打油，功能完好。
              price: 199.0
              original_price: 399.0
              category_id: 1
              condition: excellent
              campus_id: 1
              image_ids: [42, 43, 44]
      responses:
        '200':
          description: 发布成功，返回商品详情（status = on_sale）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProductDetail'
              example:
                code: 0
                message: ok
                data:
                  id: 101
                  title: 罗技 K845 机械键盘
                  price: 199.0
                  original_price: 399.0
                  condition: excellent
                  status: on_sale
                  cover:
                    id: 42
                    url: /api/images/42
                  favorite_count: 0
                  category:
                    id: 1
                    name: 数码电子
                  seller:
                    id: 1
                    display_name: 小张-示例大学(东校区)
                    nickname: 小张
                    auth_status: approved
                    role: student
                  campus:
                    id: 1
